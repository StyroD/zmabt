$kind: http-request
url: "{{baseUrl}}/api/projects"
method: POST
headers:
  Authorization: Bearer {{authToken}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "manager_id": "{{userId}}",
      "title": "Test Project Bratislava",
      "description": "A test construction project",
      "status": "pending",
      "deadline": "2026-12-01",
      "address": "Bratislava, Slovakia",
      "lat": 48.1486,
      "lng": 17.1077,
      "client_name": "Test Client",
      "client_phone": "+421900000000",
      "client_email": "client@test.com"
    }
scripts:
  - type: afterResponse
    code: |-
      var json = pm.response.json();
      pm.collectionVariables.set('projectId', json.id);
    language: text/javascript
order: 2000

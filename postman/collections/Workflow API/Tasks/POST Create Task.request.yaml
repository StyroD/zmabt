$kind: http-request
url: "{{baseUrl}}/api/tasks"
method: POST
headers:
  Authorization: Bearer {{authToken}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "project_id": "{{projectId}}",
      "title": "Vymena rozvodov",
      "description": "Replace water pipes",
      "priority": "high",
      "status": "pending",
      "deadline": "2026-06-01"
    }
scripts:
  - type: afterResponse
    code: |-
      var json = pm.response.json();
      pm.collectionVariables.set('taskId', json.id);
    language: text/javascript
order: 2000

$kind: http-request
url: "{{baseUrl}}/api/users/{{userId}}"
method: PUT
headers:
  Authorization: Bearer {{authToken}}
body:
  type: formdata
  content:
    - type: text
      key: first_name
      value: Peter
    - type: text
      key: last_name
      value: Novak
    - type: text
      key: hourly_rate
      value: "30"
    - type: text
      key: phone
      value: "+421900000000"
    - type: file
      key: avatar
      src:
        - ""
order: 2000
